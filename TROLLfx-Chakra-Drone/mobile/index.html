<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TROLLfx Chakra Drone | Pixel</title><style>
*{box-sizing:border-box}body{margin:0;background:#111322;color:#eee;font:16px system-ui}main{max-width:580px;margin:auto;padding:18px}header{text-align:center}h1{font-size:27px;margin:8px}small{color:#ba9aff;letter-spacing:.2em}.orb{border-radius:50%;width:95px;height:95px;margin:23px auto;background:radial-gradient(circle at 30% 25%,#e3d4ff,#7655c8 65%,#242040);box-shadow:0 0 50px #a47cff88;animation:breathe 5s infinite alternate}@keyframes breathe{to{transform:scale(1.18);box-shadow:0 0 65px #a47cffbb}}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:24px 0}.preset{background:#22263a;color:white;border:1px solid #41465f;border-radius:13px;padding:13px 4px;font-weight:600;font-size:12px}.preset.active{border:2px solid var(--c);background:#33344f}.preset i{display:block;width:13px;height:13px;border-radius:50%;background:var(--c);margin:0 auto 7px}.preset span{display:block;color:#bac1d4;font-size:11px}.panel{background:#1c2030;border-radius:18px;padding:18px}label{display:flex;justify-content:space-between;margin:17px 0 4px;font-weight:550}.val{color:#bea5ff}input{width:100%;accent-color:#ad8cff;height:25px}select{width:100%;background:#30354a;color:white;border:1px solid #515773;border-radius:10px;padding:12px;font-size:16px}#power{width:100%;margin:18px 0;border:0;border-radius:15px;padding:18px;color:white;background:#7858c5;font-weight:800;font-size:20px}#power.on{background:#aa456e}p{text-align:center;color:#b5bbce;font-size:13px}#status{min-height:18px}@media(max-width:355px){.grid{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}</style></head><body><main><header><small>TROLLfx INSTRUMENTS</small><h1>CHAKRA DRONE</h1><p>Pixel browser prototype v0.1</p></header><div class="orb"></div><div class="grid" id="presets"></div><section class="panel"><label>Chord frequency <span class="val" id="freq">639 Hz</span></label><label for="chord">Voicing</label><select id="chord"><option value="major">Major</option><option value="minor">Minor</option><option value="sus">Suspended</option><option value="fifth">Fifths</option></select><label for="morph">Wavetable morph <span class="val" id="morphV">50%</span></label><input id="morph" type="range" min="0" max="100" value="50"><label for="speed">LFO speed <span class="val" id="speedV">0.15 Hz</span></label><input id="speed" type="range" min="0" max="100" value="28"><label for="depth">LFO depth <span class="val" id="depthV">25%</span></label><input id="depth" type="range" min="0" max="100" value="25"><label for="volume">Volume <span class="val" id="volumeV">30%</span></label><input id="volume" type="range" min="0" max="75" value="30"></section><button id="power">▶ START DRONE</button><p id="status">Tap Start to enable sound</p><p>Start at low volume. Audio is synthesized locally. Frequency presets are artistic, not medical.</p></main><script>
'use strict';const $=id=>document.getElementById(id),data=[['Root',396,'#e16b76'],['Sacral',417,'#e8a46b'],['Solar',528,'#e4cb63'],['Heart',639,'#67c18a'],['Throat',741,'#70bed8'],['Third Eye',852,'#7c99e3'],['Crown',963,'#ad8ae5']],chords={major:[0,4,7,12],minor:[0,3,7,12],sus:[0,2,7,12],fifth:[0,7,12,19]};let selected=3,ctx,bus,osc=[],active=false,frame=0,last=-1,origin=0;const s={morph:.5,speed:.15,depth:.25,volume:.3};
function preset(){const box=$('presets');box.innerHTML='';data.forEach(([name,hz,color],i)=>{let b=document.createElement('button');b.className='preset'+(selected===i?' active':'');b.style.setProperty('--c',color);b.innerHTML='<i></i>'+name+'<span>'+hz+' Hz</span>';b.onclick=()=>{selected=i;preset();$('freq').textContent=hz+' Hz';if(ctx)retune()};box.appendChild(b)})}
function retune(){if(!ctx)return;const hz=data[selected][1],steps=chords[$('chord').value];osc.forEach((o,i)=>o.frequency.setTargetAtTime(hz*2**(steps[i]/12),ctx.currentTime,.02))}
function makeWave(m){const re=new Float32Array(6),im=new Float32Array(6);im[1]=1;im[2]=.36*m;im[3]=.2*m;im[5]=.1*m;return ctx.createPeriodicWave(re,im)}
function tick(){if(!active)return;const m=Math.max(0,Math.min(1,s.morph+s.depth*Math.sin(2*Math.PI*s.speed*(ctx.currentTime-origin))));if(Math.abs(last-m)>.008){const w=makeWave(m);osc.forEach(o=>o.setPeriodicWave(w));last=m}frame=requestAnimationFrame(tick)}
async function start(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio unavailable');ctx=new AC();bus=ctx.createGain();bus.gain.value=0;bus.connect(ctx.destination);for(let i=0;i<4;i++){const o=ctx.createOscillator(),g=ctx.createGain();g.gain.value=.125;o.connect(g);if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=(i-1.5)*.4;g.connect(p);p.connect(bus)}else g.connect(bus);o.start();osc.push(o)}retune()}await ctx.resume();active=true;origin=ctx.currentTime;last=-1;bus.gain.setTargetAtTime(s.volume,ctx.currentTime,.08);$('power').textContent='■ STOP DRONE';$('power').classList.add('on');$('status').textContent='Playing · '+data[selected][0];tick()}catch(e){$('status').textContent=e.message}}
function stop(){active=false;cancelAnimationFrame(frame);if(bus&&ctx)bus.gain.setTargetAtTime(0,ctx.currentTime,.05);$('power').textContent='▶ START DRONE';$('power').classList.remove('on');$('status').textContent='Stopped'}
$('power').onclick=()=>active?stop():start();$('chord').onchange=retune;
function bind(id,key,map,fmt){const el=$(id),update=()=>{s[key]=map(+el.value);$(id+'V').textContent=fmt(s[key]);if(key==='volume'&&active)bus.gain.setTargetAtTime(s.volume,ctx.currentTime,.04)};el.addEventListener('input',update);update()}
bind('morph','morph',v=>v/100,v=>Math.round(v*100)+'%');bind('speed','speed',v=>.01*Math.pow(300,v/100),v=>v.toFixed(2)+' Hz');bind('depth','depth',v=>v/100,v=>Math.round(v*100)+'%');bind('volume','volume',v=>v/100,v=>Math.round(v*100)+'%');preset();document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)stop()});
</script></body></html>
